name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: farmsquare-connect/package-lock.json

      - name: Install dependencies
        working-directory: ./farmsquare-connect
        run: npm ci

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Build with base path
        working-directory: ./farmsquare-connect
        env:
          # Replace 'MY-FARM-SQUARE-WORK' with your actual repository name
          # If your repo is at github.com/username/repo-name, use '/repo-name/'
          # For root domain (username.github.io), use '/'
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './farmsquare-connect/dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

