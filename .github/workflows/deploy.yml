name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Build with base path
        env:
          # Repository name: farmsquare-connect
          # Site URL: https://bosspetite.github.io/farmsquare-connect/
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: |
          echo "Building with base path: /${{ github.event.repository.name }}/"
          npm run build
          echo "Build complete. Checking dist folder:"
          ls -la dist/
          echo "Checking assets folder:"
          ls -la dist/assets/ || echo "Assets folder not found!"
          echo "Verifying index.html paths:"
          cat dist/index.html | grep -E "(src=|href=)" || echo "No src/href found"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

